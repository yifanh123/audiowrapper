; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:upesy_wrover]
platform = espressif32
board = upesy_wrover
framework = arduino
upload_speed = 115200
monitor_speed = 115200
; DIO is compatible with the module flash and is less demanding than QIO.
board_build.flash_mode = dio
; Keep the clock conservative for this older WROVER-E.
board_build.f_flash = 40000000L
board_build.partitions = huge_app.csv
extra_scripts =
    pre:scripts/patch_spotify.py
    post:scripts/use_safe_upload_frequency.py

lib_deps =
    bblanchon/ArduinoJson
    https://github.com/witnessmenow/spotify-api-arduino.git
    bodmer/TFT_eSPI
    bodmer/TJpg_Decoder
    https://github.com/Bodmer/U8g2_for_TFT_eSPI.git
    fastled/FastLED
    kosme/arduinoFFT
    https://github.com/pschatzmann/ESP32-A2DP.git

build_flags =
    -Iinclude
    -include TFT_Setup.h
    -DA2DP_I2S_AUDIOTOOLS=0
